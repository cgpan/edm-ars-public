# Pushing a tag vX.Y.Z publishes the files the installers download:
# edm-ars-X.Y.Z.tar.gz, install.sh, install.ps1 and SHA256SUMS.
# The tag must match __version__ in edmars/__init__.py (make_release.py
# refuses otherwise). A tag with a suffix (v0.2.0-rc1) becomes a
# pre-release, which the installers' "latest" does not pick up.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the release files
        run: python scripts/make_release.py --version "${GITHUB_REF_NAME#v}"
      - name: Check the installer against the built tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum -c SHA256SUMS)
          sh dist/install.sh --from-local "dist/edm-ars-$VERSION.tar.gz" \
            --dir "$RUNNER_TEMP/edm-ars" --bin-dir "$RUNNER_TEMP/bin" \
            --no-modify-path --no-onboard --yes
          "$RUNNER_TEMP/bin/edmars" version
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in
              *-*) gh release create "$TAG" --verify-tag --title "EDM-ARS ${TAG#v}" --generate-notes --prerelease ;;
              *) gh release create "$TAG" --verify-tag --title "EDM-ARS ${TAG#v}" --generate-notes ;;
            esac
          fi
          gh release upload "$TAG" dist/* --clobber
