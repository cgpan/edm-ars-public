# config.yaml -- central configuration for EDM-ARS.
#
# API keys never go in this file. They are read from environment
# variables or from a .env file at the repository root; copy
# .env.example to .env to start (see README -> API keys).
#
# llm_provider picks the API every agent calls. Each provider has its own
# block below naming the model for each agent.
#   deepseek   default; needs DEEPSEEK_API_KEY
#   openai     OpenAI or any OpenAI-compatible server; needs OPENAI_API_KEY
#              and an `openai:` block (see the commented example below)
#   anthropic  Claude; needs ANTHROPIC_API_KEY; uses the `models:` block
#   minimax    kept so runs made before DeepSeek became the default can be
#              reproduced; needs MINIMAX_API_KEY
# DeepSeek's thinking mode is switched off by BaseAgent.call_llm: the
# thinking-block overhead broke code generation and the Writer when
# MiniMax (which cannot turn it off) was the default.
llm_provider: deepseek   # deepseek | openai | anthropic | minimax

# Model per agent for llm_provider: anthropic. The loader requires this
# block to exist whichever provider is active; with any other provider
# it is not used. Anthropic has no built-in fallback model, so every
# stage a run calls needs a line here (the pre-flight refuses a run
# that is missing one).
models:
  problem_formulator: claude-sonnet-4-6
  data_engineer: claude-sonnet-4-6
  analyst: claude-sonnet-4-6
  critic: claude-opus-4-6
  writer: claude-sonnet-4-6
  outline_agent: claude-sonnet-4-6    # called while writer.outline_first is true
  # revision_writer: claude-sonnet-4-6  # review gate revisions; defaults to writer
  # verifier: claude-sonnet-4-6         # only with verification.judge_enabled; must accept images

# DeepSeek model config (used when llm_provider: deepseek)
# Requires DEEPSEEK_API_KEY (an environment variable, or a line in the
# .env file at the repository root -- see .env.example and README).
# Endpoint is OpenAI-compatible; uses the openai SDK under the hood.
#
# Model tiering (2026-07-11): each agent routes independently, so
# reasoning-light stages can run on the cheap tier (deepseek-flash)
# while reasoning-heavy stages keep deepseek-v4-pro. Current tiers:
#   flash — outline_agent: structured outline from precomputed numbers;
#     no code generation, no scientific judgment.
#   pro (keep) — problem_formulator (research framing + novelty),
#     data_engineer + analyst (code generation; DE first-pass
#     reliability is already ~50%, backlog B7 — do NOT downgrade),
#     critic (SPEC: strongest tier), writer + revision_writer (the
#     paper IS the product; gate scores depend on prose quality).
# Finer-grained overrides (mixed providers per stage) are available
# via per_stage_providers — see src/agents/provider_resolver.py.
deepseek:
  base_url: https://api.deepseek.com
  models:
    problem_formulator: deepseek-v4-pro
    data_engineer: deepseek-v4-pro
    analyst: deepseek-v4-pro
    critic: deepseek-v4-pro
    writer: deepseek-v4-pro
    revision_writer: deepseek-v4-pro
    outline_agent: deepseek-flash
    # V6: post-Writer manuscript verification. Needs vision --
    # it inspects each embedded figure against its caption, and
    # nothing in this project has ever looked at a figure.
    verifier: deepseek-flash

# MiniMax model config (legacy; kept so older runs can be reproduced).
# Requires MINIMAX_API_KEY in environment.
minimax:
  base_url: https://api.minimax.io/anthropic
  models:
    problem_formulator: MiniMax-M2.7
    data_engineer: MiniMax-M2.7
    analyst: MiniMax-M2.7
    critic: MiniMax-M2.7
    writer: MiniMax-M2.7
    revision_writer: MiniMax-M2.7

# OpenAI, or any OpenAI-compatible server (used when llm_provider: openai).
# There is deliberately no built-in model list for this provider: name a
# model for every agent below, or that agent fails with an error naming
# the missing key. Uncomment the block and replace each <model id>.
# Requires OPENAI_API_KEY. For a local or third-party server, set base_url
# here or OPENAI_BASE_URL in the environment.
# openai:
#   base_url: null
#   models:
#     problem_formulator: <model id>
#     data_engineer: <model id>
#     analyst: <model id>
#     critic: <model id>            # SPEC: the strongest model you have
#     writer: <model id>
#     outline_agent: <model id>
#     revision_writer: <model id>   # review gate revisions (gate only)
#     verifier: <model id>          # optional judge; must accept images

# K1 (2026-08-08) — token metering and cost accounting.
#
# Every run writes token_usage.jsonl (one MEASURED row per LLM call,
# with prompt / completion / cached-input kept separate) and a
# run_cost.json summary. Cost = those measured counts x the rates below.
#
# Rates live here, not in code, for two reasons: they change, and a
# hardcoded constant silently goes stale. A model with NO entry here
# produces cost_usd = null for its calls and is listed under
# `unpriced_models` — never a silent zero. Because the raw counts are
# stored, a rate correction re-prices old runs without re-running them.
#
# VERIFY THESE AGAINST THE PROVIDER'S CURRENT PRICE LIST before quoting
# a figure externally; they are the operator's input, not a measurement.
pricing:
  currency: USD
  per_million_tokens:
    deepseek-v4-pro:
      input: 0.28
      cached_input: 0.028   # DeepSeek prices a prompt-cache hit ~10x lower
      output: 0.42
    # NOT VERIFIED against the current price list. These rates were
    # carried over from the flash tier's previous model id when DeepSeek
    # renamed it to `deepseek-flash`; the real rates may differ. A wrong
    # rate here is silent -- run_cost.json will report a number, just the
    # wrong one. Confirm before quoting a figure externally, then set
    # `verified: true`.
    deepseek-flash:
      input: 0.07
      cached_input: 0.007
      output: 0.28
      verified: false   # rates above not checked against the price list

pipeline:
  # Study type: prediction | causal_soo | causal_itr | causal_did | psychometrics
  # Only prediction starts from a free-text question (--prompt). The other
  # four need a locked research spec (--research-spec <file>); the spec
  # names its own study type, which takes precedence over this value.
  task_type: prediction
  max_revision_cycles: 2
  random_state: 42
  cost_budget_usd: 5.0     # soft limit; log warning if exceeded, do not abort
  mlp_enabled: false        # MLP disabled by default (KernelExplainer timeout risk)
  # Hard ceiling for one execution of the generated analysis script.
  # Leave unset (null) to derive it: 600s for a single pass, doubled when
  # class_imbalance.ablation_enabled trains the battery a second time.
  # Set a number here only to override that. Inner BLAS/OpenMP pools are
  # capped by the executor (src/sandbox.py: blas_thread_env) -- without
  # that cap a bigger number here just buys an oversubscribed run more
  # time to be slow.
  analysis_exec_timeout_s: null

class_imbalance:
  minority_threshold: 0.20   # minority < 20% triggers SMOTE
  smote_random_state: 42
  smote_k_neighbors: 5
  fbeta_beta: 2              # F2 emphasizes recall (at-risk detection)
  ablation_enabled: true     # train once without SMOTE for comparison

# Where the AI-written analysis code runs.
#
# enabled: false -- the default, and the setting every validated run used.
#   The code runs as an ordinary child process on your computer, with your
#   user's permissions and network access; API keys are removed from its
#   environment. See DISCLAIMER.md before you run anything.
#
# enabled: true -- EXPERIMENTAL. Runs the code in a Docker container with
#   no network, but no validated run has used it, and it has known gaps:
#   the image has no R, so psychometrics cannot run in it; and memory_limit
#   "4g" is below what a full HSLS:09 load needs (the 2 GB CSV takes about
#   6.6 GB in pandas), so HSLS runs can be killed for running out of
#   memory. If the Docker daemon is not reachable, EDM-ARS falls back to
#   the child process described above.
sandbox:
  enabled: false
  # Interpreter for the generated code when the sandbox is off.
  # null = the same Python that runs EDM-ARS (sys.executable).
  python_executable: null
  # Docker settings (used only when enabled: true).
  image: "edm-ars-sandbox:latest"
  memory_limit: "4g"
  cpu_count: 2
  network_disabled: true
  auto_build: true   # build the image from ./Dockerfile if it is missing

# R bridge (psychometrics only). R 4.4+ must be installed with the
# packages listed in README -> Prerequisites. EDM-ARS looks for Rscript on
# PATH and in the usual install folders. If it cannot find it, set the
# full path to the Rscript program here (for example
# "C:/Program Files/R/R-4.5.1/bin/Rscript.exe" or "/usr/local/bin/Rscript"),
# or set the EDM_ARS_RSCRIPT environment variable instead.
r_bridge:
  rscript_path: null

# Every LLM provider call.
llm:
  request_timeout_s: 600    # seconds one API call may take before it counts
                            # as timed out
  max_network_retries: 3    # retries, with backoff, after a dropped
                            # connection or a timeout; waits for rate limits
                            # (HTTP 429) are handled separately

semantic_scholar:
  base_url: https://api.semanticscholar.org/graph/v1
  max_results: 100
  # Arc P5 / F-P5-DEPTH-RECENCY-SKEW.
  # year_filter is a ROLLING recency window in years. Set to 10 it sent
  # `year=2016-2026` on every request, so anything older was excluded at
  # the HTTP layer and NO client-side re-ranking could recover it: a real
  # run retrieved 2024x4 / 2025x79 / 2026x17, oldest paper 2024, while
  # every anchor venue needs ~27% of its references older than 10 years.
  # Semantics:
  #   year_filter: <int>  rolling window, <current-N>..<current> (legacy)
  #   year_filter: null   no recency floor; sends <year_floor>..<current>
  year_filter: null
  # Absolute lower bound used when year_filter is null. Keeps the request
  # an explicit inclusive range (S2 also accepts the open form "-<year>").
  # Set to null to omit the year parameter from the request entirely.
  year_floor: 1900
  # One extra request per run, deliberately WITHOUT a year window, using
  # the server-side minCitationCount filter to pull a high-influence
  # slice into the pool. This is what makes foundational work (Tatsuoka
  # 1983, Junker & Sijtsma 2001, de la Torre 2011) reachable at all.
  # Cost: S2 requests 3 -> 4 per run, ~+1.5 s latency, no extra quota.
  seminal_query:
    enabled: true
    min_citations: 50        # NOT CALIBRATED — spec §7.5: calibrate to the
                             # P25 citationCount of anchor refs aged 11+ y.
    limit: 20                # rows requested by the seminal query
    min_primary_pool: 3      # skip when the topical queries returned fewer
                             # records than this (S2 degraded -> don't spend
                             # another request and compound 429 exposure)
    reserved_pool_slots: 20  # seminal records protected from the
                             # year-descending trim down to max_results
  request_delay_s: 0.5     # initial delay before first attempt (rate limit courtesy)
  max_retries: 3           # retry attempts after initial failure (total = max_retries + 1)
  backoff_base_s: 1.0      # base delay for exponential backoff (seconds)
  backoff_factor: 2.0      # multiplier per retry: 1s → 2s → 4s
  backoff_jitter: true     # add ±25% random jitter to prevent thundering herd
  # Contact email sent with Crossref lookups (Crossref's "polite pool",
  # which is more reliable than anonymous use). null = send none. The
  # CROSSREF_MAILTO environment variable overrides this value.
  crossref_mailto: null

arxiv:
  enabled: true
  max_results_per_query: 10    # papers per arXiv query (3 queries = up to 30 arXiv papers)

# Memory of earlier runs. After each run, its question, variables,
# headline result and open questions are appended to `path` (a local
# file). At the start of the next run that summary is included in the
# ProblemFormulator's and Critic's prompts -- and so sent to the AI
# provider -- to steer away from repeating a study. false = no memory
# is read or written.
findings_memory:
  enabled: true
  path: findings_memory/memory.yaml
  n_candidate_specs: 3                  # number of candidate specs generated before selecting best

# VERIFYING stage: the deterministic invariant battery (src/invariants.py)
# held against the finished manuscript and the run's own artifacts.
#
# Always runs and always writes invariants.json + run_status.json.
# `blocking` decides whether a critical finding also sets the terminal
# state to INCOMPLETE. It ships False on purpose: every one of the
# fourteen archived papers fails at least one of these checks, so
# switching it on globally would terminate every run and teach nothing.
# Promote individual codes with `blocking_codes` once each has a
# false-positive rate somebody has actually measured.
verification:
  enabled: true
  blocking: false
  # The LLM judge over the finished manuscript (src/agents/verifier.py).
  # OFF by default: it costs a call per run plus one per figure, and an
  # A/B that measures whether the pipeline PRODUCES fewer defects must
  # not have a judge in one arm FINDING more of them. Its marginal
  # recovery over the deterministic battery is measured separately,
  # offline, against the answer key.
  judge_enabled: false
  # Promoted on measurement, one code at a time. Setting this list at all
  # overrides `blocking` above: ONLY these codes stop a run.
  #
  # INV_LATEX_NO_PDF -- pdflatex said it produced no PDF, no PDF sits
  # beside the log that proves one was attempted, or pdflatex never ran
  # (a manuscript with neither paper.log nor paper.pdf; this third case
  # was added after the measurement below). Measured over all 37
  # archived manuscripts plus the four templates: one firing, on the one
  # paper that provably did not compile. Zero false positives. This is
  # the least arguable finding the battery can make -- the deliverable
  # does not exist -- and it is exactly the case that used to be released
  # as `reason: clean`, at severity major, with no PDF anywhere.
  #
  # INV_LATEX_ENVIRONMENT_UNBALANCED is deliberately NOT here. Same zero
  # false positives over the same 41 documents, but it reports a cause,
  # and a cause can in principle be survivable: a stray `\end` sometimes
  # only warns. Blocking belongs on the finding that says the artifact is
  # missing, not on the one that explains why.
  blocking_codes: [INV_LATEX_NO_PDF]

review_gate:
  # Optional automated review by LSAR, a separate public repository:
  # https://github.com/cgpan/LSAR-public. To turn it on you need a local
  # checkout of LSAR, its Python packages installed into this same
  # environment (pip install -r requirements-lsar.txt), a DeepSeek key
  # (LSAR's own config uses DeepSeek), and LSAR_HOME set to the checkout
  # folder. See README -> 'The review gate'. Off by default so a fresh
  # clone runs without it.
  enabled: false
  # Calibrated P25 gate: the thresholds file ships with LSAR and was
  # computed from reviews of published papers under LSAR's pinned models.
  calibration_path: '${LSAR_HOME}/calibration/anchors_edm.yaml'
  median_samples: 3          # borderline-triggered median review (MAD 1.9)
  median_trigger_band: 1.5
  lsar_project_path: "${LSAR_HOME}"
  lsar_config_path: "${LSAR_HOME}/config.yaml"
  venue: "EDM"
  max_cycles: 2
  pass_threshold: 5.5        # minimum overall score to pass
  dimension_floor: 3          # minimum score for any individual dimension
  # Model that rewrites the paper between gate cycles. The gate first uses
  # <provider>.models.revision_writer, then the provider's writer model;
  # this value is only the last resort for the deepseek provider.
  revision_model: "deepseek-v4-pro"
  revision_max_tokens: 16000

# V5 Arc T - ideation layer (idea tournament + venue routing).
# Closes backlog H5: the code defaults now live here; every module reads
# this block with the previous hardcoded value as the fallback, so an
# absent key changes nothing.
ideation:
  venue_fit:
    # H8: the blind-derived v2 table is the table the tournament scores
    # against (declarative clause predicates, evaluated by
    # src/ideation/venue_fit.py::evaluate_predicate). Direct callers of
    # score_venue_fit without a rules_path still get the v1 table.
    rules_path: data_registry/venue_fit_rules_v2.yaml
  routing:
    # H2 Option C (owner decision 2026-08-06): dual-target with venue
    # routing. Causal + national-survey work -> policy-causal family;
    # measurement / psychometrics / prediction-method work ->
    # computational-edm family. See src/ideation/venue_router.py.
    # AERA_OPEN has NO LSAR calibration: policy-routed ideas carry
    # gate_status advisory-uncalibrated-venue until an anchor corpus and
    # P25 gate exist (H2 roadmap sec. 6 step 6).
    policy_venue: AERA_OPEN
    computational_venue: EDM
    psychometrics_venue: JEDM
  tournament:
    judge_samples: 3            # k samples per orientation (C4 median)
    # null = use the temperature in agent_prompts/idea_judge.yaml (the
    # source of truth; a small positive value on purpose - at 0 the k
    # samples would be identical draws).
    judge_temperature: null
    weight_venue_fit: 0.30      # BT prior: venue_fit term weight
    weight_feasibility_penalty: 0.20   # BT prior: penalty term weight
    bt_prior_sd: 1.0            # Bradley-Terry prior SD
    max_survivors_to_tournament: 12
    swiss_rounds: 5
  priorart:
    purpose_coverage_min: 0.60  # fraction of PURPOSE terms a collision must cover
    anchor_corpus: "${LSAR_HOME}/outputs"

writer:
  outline_first: true
  # conference: ACM sigconf paper (templates/paper_template_v2.tex;
  #   LaTeX needs the acmart class and bibtex).
  # journal: APA 7 manuscript, written section by section, ~8,000 words
  #   (templates/paper_template_journal.tex; needs apa7, biblatex-apa, biber).
  venue_format: conference

# Journal byline (writer.venue_format: journal). Unset, the byline is
# EDM-ARS alone. To credit people, list them here and keep EDM-ARS in the
# list. Conference papers ignore this key: their authors are the block in
# templates/paper_template_v2.tex (uncomment and fill in the AI and human
# author blocks there).
# paper:
#   authors: ["EDM-ARS", "Your Name"]

paths:
  data_registry: data_registry/
  raw_data: data/raw/
  output_base: output/
  agent_prompts: agent_prompts/
  paper_template: templates/paper_template_v2.tex
