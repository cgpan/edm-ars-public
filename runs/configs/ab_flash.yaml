# A/B config -- V6 quality arc.
#
# ONE config used by BOTH arms, so the only difference between them is
# the code. Arm A is a git worktree at the pre-arc commit; Arm B is the
# working tree. Anything set here is set identically for both.
#
# Every stage runs on `deepseek-flash`. Note this differs from the archived runs,
# which used `deepseek-v4-pro` for the six reasoning stages -- so numbers
# here are NOT comparable to archived LSAR scores or costs. They are
# comparable arm-to-arm, which is the only comparison being made.
#
# review_gate is OFF in both arms, deliberately. A gate that prevents
# production changes the object the study measures, and an LSAR score on
# a paper LSAR helped revise is not a measurement of that paper.
#
# verification runs but does not block: the battery is the instrument,
# and an instrument that halts the run it is measuring stops measuring.

llm_provider: deepseek

models:
  problem_formulator: claude-sonnet-4-6
  data_engineer: claude-sonnet-4-6
  analyst: claude-sonnet-4-6
  critic: claude-opus-4-6
  writer: claude-sonnet-4-6

deepseek:
  base_url: https://api.deepseek.com
  models:
    problem_formulator: deepseek-flash
    data_engineer: deepseek-flash
    analyst: deepseek-flash
    critic: deepseek-flash
    writer: deepseek-flash
    revision_writer: deepseek-flash
    outline_agent: deepseek-flash
    # V6: post-Writer manuscript verification. Needs vision --
    # it inspects each embedded figure against its caption, and
    # nothing in this project has ever looked at a figure.
    verifier: deepseek-flash  # tiered 2026-07-11

minimax:
  # Retained for backward-compat / quick rollback. NOT active under this
  # config (llm_provider: deepseek above).
  base_url: https://api.minimax.io/anthropic
  models:
    problem_formulator: MiniMax-M2.7
    data_engineer: MiniMax-M2.7
    analyst: MiniMax-M2.7
    critic: MiniMax-M2.7
    writer: MiniMax-M2.7
    revision_writer: MiniMax-M2.7
    outline_agent: MiniMax-M2.7

openai:
  models:
    problem_formulator: gpt-5.4  # not used; per_stage_providers selects
    data_engineer: gpt-5.4
    analyst: gpt-5.4
    critic: gpt-5.4
    writer: gpt-5.4
    revision_writer: gpt-5.4
    outline_agent: gpt-5.4

# Phase 3b.10 / §10.1.3 — per-stage provider overrides.
# Analyst + Writer continue to route to OpenAI gpt-5.4 (3b.10 hardening).
# All other stages use the default (deepseek per llm_provider above).
per_stage_providers: {}

# Phase 3b.10 / §10.2 — per-stage max_tokens budgets.
default_max_tokens: 8000
per_stage_max_tokens:
  analyst: 16000
  # 16000 was not enough. The first A/B run produced a complete 69 KB
  # manuscript that was CUT OFF mid-sentence at the ceiling; the
  # reassembler's body regex needs a closing structural boundary, a
  # truncated response has none, and the run shipped a 287-byte
  # paper.tex as COMPLETED. deepseek-flash accepts 64000; 32000 is twice
  # the observed requirement. Applies to BOTH arms.
  writer: 32000
  critic: 16000
  problem_formulator: 16000
  data_engineer: 12000

pipeline:
  task_type: prediction
  max_revision_cycles: 1
  random_state: 42
  cost_budget_usd: 100.0
  mlp_enabled: false

# Phase 3b.10 / §10.4 — task_id override marker. Not consumed by the
# orchestrator's CLI yet (the existing --output-dir flag from 3b.4
# handles run-dir disambiguation without editing the fixture). The
# fixture's task_id remains "v3_0_smoketest_mtheff_college_3b7" for
# direct comparability with 3b.7/3b.9 artifacts.
run:
  task_id_override: v3_0_smoketest_mtheff_college_3b11
  output_dir_template: runs/v3_0_smoketest_mtheff_college_<YYYYMMDD>_3b11/

class_imbalance:
  minority_threshold: 0.20
  smote_random_state: 42
  smote_k_neighbors: 5
  fbeta_beta: 2
  ablation_enabled: true

sandbox:
  enabled: false
  image: "edm-ars-sandbox:latest"
  memory_limit: "4g"
  cpu_count: 2
  network_disabled: true
  auto_build: true

semantic_scholar:
  base_url: https://api.semanticscholar.org/graph/v1
  max_results: 100
  year_filter: 10
  request_delay_s: 0.5
  max_retries: 3
  backoff_base_s: 1.0
  backoff_factor: 2.0
  backoff_jitter: true

arxiv:
  enabled: true
  max_results_per_query: 10

findings_memory:
  enabled: false
  path: findings_memory/memory.yaml
  n_candidate_specs: 1

review_gate:
  enabled: false
  # Arc L (user decision 2026-07-03): calibrated P25 gate; the file is
  # rewritten by LSAR calibration_analyze.py under the CURRENT provider.
  calibration_path: '${LSAR_HOME}/calibration/anchors_edm.yaml'
  median_samples: 3          # borderline-triggered median review (MAD 1.9)
  median_trigger_band: 1.5
  lsar_project_path: "${LSAR_HOME}"
  lsar_config_path: "${LSAR_HOME}/config.yaml"
  venue: "EDM"
  max_cycles: 1
  pass_threshold: 5.5
  dimension_floor: 3
  revision_model: "deepseek-v4-pro"
  revision_max_tokens: 16000

writer:
  outline_first: true

paths:
  data_registry: data_registry/
  # Both arms must read the same bytes for the comparison to mean
  # anything. If you run the two arms from separate checkouts, make
  # this an absolute path to one shared copy of the raw CSV rather
  # than letting each checkout resolve it to its own.
  raw_data: data/raw/
  output_base: output/
  agent_prompts: agent_prompts/
  paper_template: templates/paper_template.tex

verification:
  enabled: true
  blocking: false
  # The LLM judge over the finished manuscript (src/agents/verifier.py).
  # OFF by default: it costs a call per run plus one per figure, and an
  # A/B that measures whether the pipeline PRODUCES fewer defects must
  # not have a judge in one arm FINDING more of them. Its marginal
  # recovery over the deterministic battery is measured separately,
  # offline, against the answer key.
  judge_enabled: false
  blocking_codes: []
