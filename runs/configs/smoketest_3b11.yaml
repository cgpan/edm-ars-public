# Phase 3b.11 smoke-test config — DeepSeek-V4-Pro default + OpenAI gpt-5.4 for Analyst+Writer.
#
# Phase 3b.10.5 update: MiniMax-M2.7 replaced with DeepSeek-V4-Pro as the
# default provider for non-OpenAI stages. The MiniMax-M2.7 thinking-block
# overhead diagnosed in 3b.9 (F-3b9-ANALYST-CODEGEN-CRASH +
# F-3b9-WRITER-ONLY-BIBTEX) is structurally addressed by:
#   (a) DeepSeek-V4-Pro running with thinking mode DISABLED (BaseAgent
#       call_llm passes extra_body={'thinking': {'type': 'disabled'}}),
#   (b) per_stage_providers routing Analyst + Writer to OpenAI gpt-5.4
#       under the existing 3b.10 hardening — both stages were the worst
#       affected by the 3b.9 collapse.
#
# Diffs from the 3b.10 sub-wave 3 author-only version of this file:
#   - llm_provider: deepseek (was: minimax)
#   - deepseek block added with deepseek-v4-pro for every stage
#   - minimax block retained for backward-compat / quick rollback
#
# All other settings copied from 3b.7/3b.9 for direct comparability.

llm_provider: deepseek

models:
  problem_formulator: claude-sonnet-4-6
  data_engineer: claude-sonnet-4-6
  analyst: claude-sonnet-4-6
  critic: claude-opus-4-6
  writer: claude-sonnet-4-6

deepseek:
  base_url: https://api.deepseek.com
  models:
    problem_formulator: deepseek-v4-pro
    data_engineer: deepseek-v4-pro
    analyst: deepseek-v4-pro  # not used; per_stage_providers routes to openai
    critic: deepseek-v4-pro
    writer: deepseek-v4-pro  # not used; per_stage_providers routes to openai
    revision_writer: deepseek-v4-pro
    outline_agent: deepseek-v4-pro

minimax:
  # Retained for backward-compat / quick rollback. NOT active under this
  # config (llm_provider: deepseek above).
  base_url: https://api.minimax.io/anthropic
  models:
    problem_formulator: MiniMax-M2.7
    data_engineer: MiniMax-M2.7
    analyst: MiniMax-M2.7
    critic: MiniMax-M2.7
    writer: MiniMax-M2.7
    revision_writer: MiniMax-M2.7
    outline_agent: MiniMax-M2.7

openai:
  models:
    problem_formulator: gpt-5.4  # not used; per_stage_providers selects
    data_engineer: gpt-5.4
    analyst: gpt-5.4
    critic: gpt-5.4
    writer: gpt-5.4
    revision_writer: gpt-5.4
    outline_agent: gpt-5.4

# Phase 3b.10 / §10.1.3 — per-stage provider overrides.
# Analyst + Writer continue to route to OpenAI gpt-5.4 (3b.10 hardening).
# All other stages use the default (deepseek per llm_provider above).
per_stage_providers:
  analyst:
    provider: openai
    model: gpt-5.4
  writer:
    provider: openai
    model: gpt-5.4

# Phase 3b.10 / §10.2 — per-stage max_tokens budgets.
default_max_tokens: 8000
per_stage_max_tokens:
  analyst: 32000
  writer: 32000
  critic: 16000
  problem_formulator: 16000
  data_engineer: 12000

pipeline:
  task_type: causal_soo
  max_revision_cycles: 1
  random_state: 42
  cost_budget_usd: 100.0
  mlp_enabled: false

# Phase 3b.10 / §10.4 — task_id override marker. Not consumed by the
# orchestrator's CLI yet (the existing --output-dir flag from 3b.4
# handles run-dir disambiguation without editing the fixture). The
# fixture's task_id remains "v3_0_smoketest_mtheff_college_3b7" for
# direct comparability with 3b.7/3b.9 artifacts.
run:
  task_id_override: v3_0_smoketest_mtheff_college_3b11
  output_dir_template: runs/v3_0_smoketest_mtheff_college_<YYYYMMDD>_3b11/

class_imbalance:
  minority_threshold: 0.20
  smote_random_state: 42
  smote_k_neighbors: 5
  fbeta_beta: 2
  ablation_enabled: true

sandbox:
  enabled: false
  image: "edm-ars-sandbox:latest"
  memory_limit: "4g"
  cpu_count: 2
  network_disabled: true
  auto_build: true

semantic_scholar:
  base_url: https://api.semanticscholar.org/graph/v1
  max_results: 100
  year_filter: 10
  request_delay_s: 0.5
  max_retries: 3
  backoff_base_s: 1.0
  backoff_factor: 2.0
  backoff_jitter: true

arxiv:
  enabled: true
  max_results_per_query: 10

findings_memory:
  enabled: false
  path: findings_memory/memory.yaml
  n_candidate_specs: 1

review_gate:
  enabled: true
  lsar_project_path: "${LSAR_HOME}"
  lsar_config_path: "${LSAR_HOME}/config.yaml"
  venue: "EDM"
  max_cycles: 1
  pass_threshold: 5.5
  dimension_floor: 3
  revision_model: "deepseek-v4-pro"
  revision_max_tokens: 16000

writer:
  outline_first: true

paths:
  data_registry: data_registry/
  raw_data: data/raw/
  output_base: output/
  agent_prompts: agent_prompts/
  paper_template: templates/paper_template.tex
